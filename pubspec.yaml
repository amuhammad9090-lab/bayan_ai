name: bayan_ai
description: Asisten AI untuk OCR mushaf, pencarian ayat & tafsir, dan analisis nahwu (Flutter + Google Gemini + Firebase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  lucide_icons_flutter: ^3.0.0

  # Animasi
  flutter_animate: ^4.5.0

  # Firebase (login + Firestore)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/icon_background.png"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  min_sdk_android: 21

# Splash bawaan OS (sebelum Flutter jalan), disamakan dengan SplashPage:
# latar biru + logo tile putih. Jalankan: dart run flutter_native_splash:create
flutter_native_splash:
  # Android < 12: latar gradien (pakai color ATAU background_image, bukan dua-duanya).
  background_image: assets/splash/splash_bg.png
  image: assets/splash/splash_logo.png
  android_12:
    # Android 12+ memotong ikon jadi lingkaran: tile ditaruh di dalam area aman.
    image: assets/splash/splash_android12.png
    icon_background_color: "#1B6FB0"
    color: "#1B6FB0"
  web: false
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/icon.png
    - assets/images/
    - assets/quran/quran_id.json

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ScheherazadeNew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: LPMQ
      fonts:
        - asset: assets/fonts/LPMQ_IsepMisbah.ttf
